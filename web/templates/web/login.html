{% extends "web/base.html" %}
{% block title %}로그인{% endblock %}
{% block content %}
    <h1>로그인</h1>
    <form id="loginForm">
        <label>아이디 <input type="text" id="username" name="username" required></label><br><br>
        <label>비밀번호 <input type="password" id="password" name="password" required></label><br><br>
        <button type="submit">로그인</button>
    </form>
    <p id="message"></p>
    <p>계정이 없으신가요? <a href="/signup/">회원가입</a></p>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const res = await fetch('/login/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            document.getElementById('message').innerText = data.success
                ? '로그인 성공'
                : (data.error || '로그인 실패');
            if (data.success) {
                window.location.href = '/announce/';
            }
        });
    </script>
{% endblock %}
